global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"] # Traefik metrics endpoint
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8085"] # API Gateway metrics endpoint

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:9100"] # Auth Service metrics endpoint

  - job_name: cart-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cart-service:9200"] # Cart Service metrics endpoint

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:9800"] # Inventory Service metrics endpoint

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:9500"] # Notification Service metrics endpoint

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:9300"] # Order Service metrics endpoint

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:9600"] # Payment Service metrics endpoint

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:9400"] # Product Service metrics endpoint
