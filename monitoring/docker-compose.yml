secrets:
  discord_webhook:
    file: ./alertmanager/alertmanager-secrets/discord-webhook-url

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.phumlaniarendse.co.za`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=staging" # Your resolver name
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=proxy-net"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-net
      - proxy-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    env_file:
      - .env
    secrets:
      - discord_webhook
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/data"
    volumes:
      - ./alertmanager/config:/etc/alertmanager:ro
      # - ./alertmanager/alertmanager-secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/data
    networks:
      - microservices-net

  loki:
    image: grafana/loki:3.6.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config/loki.yml
    volumes:
      - ./loki/config/loki.yml:/etc/loki/config/loki.yml:ro
      - loki-data:/loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.phumlaniarendse.co.za`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.routers.loki.tls.certresolver=staging" # Your resolver name
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.docker.network=proxy-net"
    networks:
      - microservices-net
      - proxy-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.phumlaniarendse.co.za`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=staging"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - microservices-net
      - proxy-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8300:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/wsl/docker-desktop-data/data/docker:/var/lib/docker:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - microservices-net

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc|rootfs)($$|/)"
      - "--collector.netclass.ignored-devices=^(lo|docker.*|veth.*)$$"
      - "--no-collector.ipvs"
    user: nobody:nobody
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - microservices-net

networks:
  microservices-net:
    name: microservices-net
    external: true
  proxy-net:
    name: "proxy-net"
    external: true

volumes:
  alertmanager-data:
    name: "alertmanager-data"
    driver: local
  grafana-storage:
    name: "grafana-storage"
    driver: local
  prometheus-data:
    name: "prometheus-data"
    driver: local
  loki-data:
    name: "loki-data"
    driver: local
