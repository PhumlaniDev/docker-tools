services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.phumlaniarendse.co.za`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=staging" # Your resolver name
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=proxy-net"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microservices-net
      - proxy-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/data
    volumes:
      - ./alertmanager/config:/etc/alertmanager:ro
      - alertmanager-data:/data
    networks:
      - microservices-net

  loki:
    image: grafana/loki:3.6.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config/loki.yml
    volumes:
      - ./loki/config/loki.yml:/etc/loki/config/loki.yml:ro
      - loki-data:/loki
    networks:
      - microservices-net
      - proxy-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.phumlaniarendse.co.za`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=staging"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - microservices-net
      - proxy-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8300:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    networks:
      - microservices-net
      - proxy-net

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc|rootfs)($$|/)"
      - "--collector.netclass.ignored-devices=^(lo|docker.*|veth.*)$$"
      - "--no-collector.ipvs"
    user: nobody:nobody
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - microservices-net
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.node-exporter.entrypoints=websecure" # Assumes you have a 'websecure' entrypoint on :443
    #   - "traefik.http.routers.node-exporter.tls=true"
    #   - "traefik.http.routers.node-exporter.tls.certresolver=staging"
    #   - "traefik.http.services.node-exporter.loadbalancer.server.port=9100"
    #   - "traefik.http.services.node-exporter.loadbalancer.server.url=http://127.0.0.1:9100"

