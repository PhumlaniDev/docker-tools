services:
  postgres:
    image: postgres:16.8
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak.phumlaniarendse.co.za # your public domain
      KC_HOSTNAME_STRICT: true # enforce it (default in prod anyway)
      KC_HOSTNAME_STRICT_HTTPS: true # force HTTPS scheme
      KC_PROXY_HEADERS: xforwarded # Traefik uses X-Forwarded-*
      KC_HTTP_ENABLED: false # disable plain HTTP listener in prod
      KC_FEATURES: scripts # if you still need custom scripts
      KC_SPI_SCRIPT_UPLOAD_ENABLED: "true"
      KC_METRICS_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped
    networks:
      - microservices-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.phumlaniarendse.co.za`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=staging"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

volumes:
  postgres_data:
    name: keycloak_postgres_data
  keycloak_data:
    name: keycloak_data

networks:
  microservices-net:
    name: "microservices-net"
    external: true
  proxy-net:
    name: "proxy-net"
    external: true
