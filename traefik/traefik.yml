global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: DEBUG
  format: common

metrics:
  prometheus: {}

accessLog:
  format: common

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

certificatesResolvers:
  cloudflare:
    acme:
      email: aphumlani.dev@gmail.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        delayBeforeCheck: "60"
  staging:
    acme:
      email: aphumlani.dev@gmail.com
      storage: /letsencrypt/acme.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: "60"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: "proxy-net"
    exposedByDefault: false
